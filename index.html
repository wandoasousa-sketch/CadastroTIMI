<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição e Prémio</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .resultado { background: #e2f0d9; border: 2px dashed #28a745; padding: 20px; border-radius: 5px; margin-top: 20px; }
        .btn-premio { display: inline-block; background: #007bff; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; }
        button:disabled { background-color: #999; cursor: wait; }
        .aviso { color: #c0392b; background: #fdecea; border-radius: 5px; padding: 10px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <!-- TELA 1: FORMULÁRIO -->
    <div id="tela-formulario">
        <h2>Preencha para participar</h2>
        <form id="meuFormulario">
            <input type="text" id="nome" placeholder="Nome Completo" required>
            <input type="number" id="idade" placeholder="Idade (18 anos ou mais)" min="18" max="120" required>
            <input type="text" id="profissao" placeholder="Profissão" required>
            <input type="tel" id="telefone" placeholder="Telefone / WhatsApp" required>
            <button type="submit" id="btn-enviar">Enviar e Revelar Link</button>
        </form>
        <div id="aviso" class="aviso hidden"></div>
    </div>

    <!-- TELA 2: SUCESSO E LINK -->
    <div id="tela-resultado" class="hidden">
        <h2>Inscrição Confirmada! 🎉</h2>
        <p>O seu número para o sorteio é:</p>
        <h1 style="color: #28a745; margin: 5px 0;" id="num-sorteio">---</h1>

        <div class="resultado">
            <p><strong>Seu Link Premiado está pronto!</strong><br>Clique no botão abaixo para entrar na plataforma final:</p>
            <a href="#" id="link-final" class="btn-premio" target="_blank">Entrar na Plataforma</a>
        </div>
    </div>
</div>

<script>
    // 1. LISTA DE LINKS COM OS MEMBROS
    const listaLinks = [
        "https://timivht.com/#/pages/login/registerView?code=djuoci&membro=Wando",
        "https://timivht.com/#/pages/login/registerView?code=dlc6vp&membro=Maúricio",
        "https://timivht.com/#/pages/login/registerView?code=dka801&membro=Junior",
        "https://timivht.com/#/pages/login/registerView?code=dsrxyt&membro=Raul",
        "https://timivht.com/#/pages/login/registerView?code=drg990&membro=AnaPaula",
        "https://timivht.com/#/pages/login/registerView?code=de3137&membro=Eli",
        "https://timivht.com/#/pages/login/registerView?code=dk4hqe&membro=Fabio",
        "https://timivht.com/#/pages/login/registerView?code=ds0ry7&membro=Mirian",
        "https://timivht.com/#/pages/login/registerView?code=drb6p1&membro=Rodrigo",
        "https://timivht.com/#/pages/login/registerView?code=dk12tm&membro=Victor",
        "https://timivht.com/#/pages/login/registerView?code=d1oolz&membro=Leandro",
        "https://timivht.com/#/pages/login/registerView?code=dig4rl&membro=Alex",
        "https://timivht.com/#/pages/login/registerView?code=dk40ki&membro=Sabrina",
        "https://timivht.com/#/pages/login/registerView?code=di0sv0&membro=Angela",
        "https://timivht.com/#/pages/login/registerView?code=dlko68&membro=Larissa",
        "https://timivht.com/#/pages/login/registerView?code=dy13nt&membro=Mickaella",
        "https://timivht.com/#/pages/login/registerView?code=dz7i7k&membro=DeboraBrasil",
        "https://timivht.com/#/pages/login/registerView?code=dtex1k&membro=Alessandra",
        "https://timivht.com/#/pages/login/registerView?code=dkrtho&membro=Edmundo",
        "https://timivht.com/#/pages/login/registerView?code=dpuft2&membro=Juliana",
        "https://timivht.com/#/pages/login/registerView?code=d4c75b&membro=Paraiba",
        "https://timivht.com/#/pages/login/registerView?code=dgxi19&membro=Debora",
        "https://timivht.com/#/pages/login/registerView?code=dqv47v&membro=Geneci"
    ];

    // 2. URL DO GOOGLE SHEETS
    const urlAPI = "https://script.google.com/macros/s/AKfycbyIT0IjCFfkzrooa4aRgp3mfUQEgssA3vaGwxC0jNP70LZQ4V7tzD_TF5rh4_RpPnz0/exec";

    // 3. FUNÇÃO QUE CONTROLA A FILA (SAIR 3 VEZES SEGUIDAS)
    function obterProximoLink() {
        let indexAtual = parseInt(localStorage.getItem('fila_index')) || 0;
        let contagemAtual = parseInt(localStorage.getItem('fila_contagem')) || 0;

        if (indexAtual >= listaLinks.length) { indexAtual = 0; contagemAtual = 0; }

        const linkEscolhido = listaLinks[indexAtual];
        contagemAtual++;

        if (contagemAtual >= 3) {
            indexAtual = (indexAtual + 1) % listaLinks.length;
            contagemAtual = 0;
        }

        localStorage.setItem('fila_index', indexAtual);
        localStorage.setItem('fila_contagem', contagemAtual);

        return linkEscolhido;
    }

    // 4. ENVIO DO FORMULÁRIO
    document.getElementById('meuFormulario').addEventListener('submit', function(e) {
        e.preventDefault();

        const aviso = document.getElementById('aviso');
        const botao = document.getElementById('btn-enviar');
        aviso.classList.add('hidden');

        // Confere a idade antes de enviar (o script também confere)
        const idade = parseInt(document.getElementById('idade').value, 10);
        if (isNaN(idade) || idade < 18) {
            mostrarAviso("É preciso ter 18 anos ou mais para participar.");
            return;
        }

        // Vê qual link é o próximo da fila (só avança a fila se o cadastro for aceito)
        let indexAtual = parseInt(localStorage.getItem('fila_index')) || 0;
        if (indexAtual >= listaLinks.length) { indexAtual = 0; }
        const linkDaVez = listaLinks[indexAtual];

        // Extrai o nome do membro de dentro do link
        const urlParams = new URLSearchParams(linkDaVez.split('?')[1]);
        const membroEscolhido = urlParams.get('membro') || "Não especificado";

        // Monta os dados para enviar
        const formData = new URLSearchParams();
        formData.append('nome', document.getElementById('nome').value);
        formData.append('idade', idade);
        formData.append('profissao', document.getElementById('profissao').value);
        formData.append('telefone', document.getElementById('telefone').value);
        formData.append('membro', membroEscolhido);

        botao.disabled = true;
        botao.innerText = "Enviando...";

        // Envia para o Google Sheets e espera a resposta
        fetch(urlAPI, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        })
        .then(function(res) { return res.json(); })
        .then(function(resposta) {
            if (resposta.status !== "ok") {
                mostrarAviso(resposta.mensagem || "Não foi possível concluir o cadastro.");
                return;
            }

            // Cadastro aceito: agora sim avança a fila e mostra o link
            document.getElementById('link-final').href = obterProximoLink();

            // Mostra o mesmo número que ficou na planilha
            document.getElementById('num-sorteio').innerText = "#" + resposta.numero;

            // Troca de tela
            document.getElementById('tela-formulario').classList.add('hidden');
            document.getElementById('tela-resultado').classList.remove('hidden');
        })
        .catch(function() {
            mostrarAviso("Erro de conexão. Verifique a internet e tente novamente.");
        })
        .finally(function() {
            botao.disabled = false;
            botao.innerText = "Enviar e Revelar Link";
        });

        function mostrarAviso(texto) {
            aviso.innerText = texto;
            aviso.classList.remove('hidden');
        }
    });
</script>

</body>
</html>
